{% extends "base.html" %}
{% block title %}Skapa konto · Mat & Vin{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Skapa konto</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Skapa konto</button>
  </form>
  <p><a href="{% url 'login' %}">Har du redan ett konto? Logga in</a></p>
</article>
{% endblock %}
